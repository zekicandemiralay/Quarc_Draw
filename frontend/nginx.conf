server {
    listen 443 ssl;
    server_name quarcnet0.tail84500c.ts.net;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/ssl/quarcnet0.tail84500c.ts.net.crt;
    ssl_certificate_key /etc/nginx/ssl/quarcnet0.tail84500c.ts.net.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Shared login (Quarc Auth) — same account works across every Quarc app.
    # More specific than /api/ below, so nginx matches this first for auth routes.
    location /api/auth/ {
        proxy_pass http://quarc-auth:3002/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
    }

    # Live updates (server-sent events): one long-lived response per open device. Must not be buffered or cut off.
    location = /api/events {
        proxy_pass http://backend:3009/api/events;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Documents go up and down as one body each (a .qdraw is a zip, tens of MB for PDF-heavy ones; the server's own
    # limit is QUARC_MAX_MB, 512 by default). nginx's default of 1 MB would refuse nearly every upload.
    location /api/ {
        proxy_pass http://backend:3009/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 640m;
    }

    # Module scripts (pdf.js' worker is one) are only run when served as JavaScript. Older nginx images do not know
    # ".mjs" and would send a generic download.
    location ~* \.mjs$ {
        default_type text/javascript;
    }

    # Service worker must never be served stale.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Every other app route is client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
